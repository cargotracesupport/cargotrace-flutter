<svg width="240" height="150" viewBox="0 0 240 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="box" x1="24" y1="40" x2="150" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0696C7"/>
    </linearGradient>
    <linearGradient id="cab" x1="150" y1="55" x2="212" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#0EA5C4"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="120" cy="132" rx="96" ry="9" fill="#2563EB" opacity="0.12"/>

  <!-- speed lines -->
  <rect x="2" y="52" width="26" height="6" rx="3" fill="#0696C7" opacity="0.45"/>
  <rect x="10" y="70" width="18" height="6" rx="3" fill="#0696C7" opacity="0.30"/>
  <rect x="4" y="88" width="24" height="6" rx="3" fill="#0696C7" opacity="0.20"/>

  <!-- cargo box -->
  <rect x="34" y="40" width="118" height="72" rx="12" fill="url(#box)"/>
  <!-- box door seam -->
  <rect x="120" y="52" width="24" height="48" rx="6" fill="#ffffff" opacity="0.18"/>
  <!-- package inside hint -->
  <rect x="52" y="60" width="34" height="34" rx="6" fill="#ffffff" opacity="0.22"/>
  <path d="M52 77 h34 M69 60 v34" stroke="#ffffff" stroke-width="3" opacity="0.35" stroke-linecap="round"/>

  <!-- cab -->
  <path d="M152 60 h30 l26 26 v26 a6 6 0 0 1 -6 6 h-50 a6 6 0 0 1 -6 -6 V66 a6 6 0 0 1 6 -6 z" fill="url(#cab)"/>
  <!-- windshield -->
  <path d="M170 68 h12 l16 16 h-28 z" fill="#EAF4FF" opacity="0.9"/>
  <!-- headlight -->
  <rect x="204" y="98" width="6" height="10" rx="3" fill="#FDE68A"/>

  <!-- bumper -->
  <rect x="34" y="108" width="180" height="10" rx="5" fill="#1E3A8A" opacity="0.85"/>

  <!-- wheels -->
  <circle cx="78" cy="120" r="17" fill="#0F1727"/>
  <circle cx="78" cy="120" r="7" fill="#94A3B8"/>
  <circle cx="176" cy="120" r="17" fill="#0F1727"/>
  <circle cx="176" cy="120" r="7" fill="#94A3B8"/>

  <!-- location pin popping out of the box -->
  <path d="M96 20 c-11 0 -20 9 -20 20 c0 15 20 30 20 30 c0 0 20 -15 20 -30 c0 -11 -9 -20 -20 -20 z" fill="#EA580C"/>
  <circle cx="96" cy="40" r="7" fill="#ffffff"/>
</svg>
